name: Android Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip and build
      run: |
        unzip -o android-project.zip -d ./project
        unzip -o TinyRecursiveModels-main.zip -d ./project/app/src/main/assets/trm
        cd project
        if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleDebug --no-daemon; fi
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project/app/build/outputs/apk/debug/app-debug.apk