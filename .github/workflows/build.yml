name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant permission
        run: chmod +x ./gradlew || true
      - name: Try Build Debug APK
        run: ./gradlew assembleDebug || ./gradlew.bat assembleDebug || echo "No gradle build"
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            app/build/outputs/**/*.apk
            *.zip