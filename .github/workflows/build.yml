name: Build APK (inject TRM)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Unzip uploaded project (android-project.zip)
        run: |
          if [ -f android-project.zip ]; then unzip -o android-project.zip -d ./project_unzipped; else echo "No android-project.zip"; fi
      - name: Inject TRM (TinyRecursiveModels-main.zip)
        run: |
          if [ -f TinyRecursiveModels-main.zip ]; then unzip -o TinyRecursiveModels-main.zip -d ./trm_unzipped || true; find ./trm_unzipped -name "*.tflite" -exec sh -c 'mkdir -p ./project_unzipped/app/src/main/assets; cp "$1" ./project_unzipped/app/src/main/assets/player_model.tflite' _ {} \; || true; fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleDebug --no-daemon
          elif [ -f ./project_unzipped/gradlew ]; then chmod +x ./project_unzipped/gradlew; (cd ./project_unzipped && ./gradlew assembleDebug --no-daemon)
          else sudo apt-get install -y gradle; gradle assembleDebug --no-daemon || true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            project_unzipped/app/build/outputs/apk/debug/*.apk
